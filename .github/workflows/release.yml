name: release

# Builds THIS tree for the ramips/mt7620_nand subtarget as an ImageBuilder-first
# release. There are no version inputs anywhere: the checkout is the pinned
# combination of ImmortalWrt and X-Wrt-derived code, so the same commit
# produces the same kernel, kmods, and ImageBuilder wherever it is built.
#
# Two triggers:
#
#  - Tag push (v<upstream-version>-rN, cut by
#    mt7620-nand/scripts/tag-release.sh): builds the tagged commit, smoke-tests
#    the generated ImageBuilder, and publishes an immutable GitHub release
#    containing the ImageBuilder, *.buildinfo, and sha256sums. Tag with -p for
#    a pre-release, then promote in place via `gh release edit --prerelease=false`
#    once hardware-tested instead of rebuilding -r2.
#
#  - workflow_dispatch: test build (or check_only pre-flight) of whatever
#    branch/commit was selected in the Actions UI — uploads artifacts,
#    publishes nothing.
#
# Releases are never modified in asset content after publishing: every build has
# a unique kernel vermagic, so a release's ImageBuilder must stay downloadable
# unchanged for as long as anyone runs firmware built from it.
on:
  push:
    tags: ["v*-r[0-9]*"]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Run pre-flight checks only (feeds, subtarget check, defconfig guards; ~2m)"
        type: boolean
        default: false
      prebuilt_toolchain:
        description: "Hydrate staging_dir/toolchain-* from ImmortalWrt's official mt7620 toolchain tarball"
        type: boolean
        default: true

# Needed to create releases with the default GITHUB_TOKEN.
permissions:
  contents: write

# Avoid overlapping runs against the same branch/tag.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Full history without blobs: git describe needs the tag graph to
      # find the upstream base, and blobs are only fetched for HEAD's tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      # BASE_REF is the nearest upstream release tag below HEAD (v25.12.1,
      # ...). Our own release tags (v25.12.1-r3) are excluded from the
      # search so a tagged HEAD still resolves to its upstream base.
      - name: Resolve build parameters
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*-r[0-9]*' HEAD)
          echo "BASE_REF=$base" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse "$base^{commit}")" >> "$GITHUB_ENV"
          echo "upstream base: $base"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
            [ "${GITHUB_REF_NAME%-r*}" = "$base" ] || {
              echo "ERROR: tag $GITHUB_REF_NAME does not match upstream base $base" >&2
              exit 1
            }
          fi

      # Disk headroom check only. GitHub's ubuntu runners have ~88 GB free
      # on a 145 GB disk (measured 2026-08); this build peaks around
      # 30-40 GB, so no cleanup of preinstalled software is needed. Should
      # a run ever fail with "No space left on device", the classic fix is
      # deleting /usr/share/dotnet /usr/local/lib/android
      # /opt/hostedtoolcache/CodeQL here (~18 GB) before building.
      - name: Report disk space
        run: df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget libelf-dev zstd curl

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # mt7620_nand is mt7620 plus NAND: its kernel config must equal
      # mt7620's plus the fragment, and every dependency gate on the
      # mt7620 subtarget name - in the tree and in the feeds just
      # installed - must name mt7620_nand too (the script's header says
      # why). Runs before building so a drift fails in minutes.
      - name: Check the subtarget is mt7620 plus NAND
        run: sh mt7620-nand/scripts/sync-subtarget-config.sh --check

      - name: Configure
        run: |
          cp mt7620-nand/config.seed .config
          make defconfig
          # defconfig silently drops symbols whose prompt is disabled or whose
          # dependencies are unsatisfied - fail loudly on load-bearing ones
          for sym in \
            CONFIG_TARGET_ramips_mt7620_nand=y \
            CONFIG_TARGET_MULTI_PROFILE=y \
            CONFIG_TARGET_PER_DEVICE_ROOTFS=y \
            CONFIG_ALL_NONSHARED=y \
            CONFIG_ALL_KMODS=y \
            CONFIG_IB=y \
            CONFIG_IB_STANDALONE=y \
            CONFIG_PACKAGE_kmod-rt2800-soc=y; do
            grep -q "^${sym}$" .config || {
              echo "ERROR: $sym missing after defconfig" >&2
              exit 1
            }
          done
          # Default subtarget radio and key device/target packages must survive defconfig
          for p in kmod-mt76x2 uboot-envtools; do
            grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config || {
              echo "ERROR: CONFIG_PACKAGE_${p} missing after defconfig" >&2
              exit 1
            }
          done

      - name: Build host tools
        if: inputs.check_only != true
        run: make -j"$(nproc)" tools/install

      # mt7620_nand uses the exact same mipsel_24kc / musl / GCC ABI as mt7620.
      # Hydrating ImmortalWrt's official SHA-256-verified toolchain archive into
      # staging_dir/toolchain-* skips ~35m of compiling GCC/binutils/musl while
      # keeping config.seed 100% stock OpenWrt.
      - name: Hydrate prebuilt toolchain
        if: inputs.check_only != true && inputs.prebuilt_toolchain != false
        run: |
          set -euo pipefail
          BASE_VER="${BASE_REF#v}"
          TOOLCHAIN_DIR=$(make --no-print-directory val.TOOLCHAIN_DIR)
          TOOLCHAIN_DIR_NAME=$(basename "$TOOLCHAIN_DIR")
          GCC_VER=$(sed -n 's/^CONFIG_GCC_VERSION="\(.*\)"/\1/p' .config)
          [ -n "$GCC_VER" ] || { echo "ERROR: CONFIG_GCC_VERSION not found in .config" >&2; exit 1; }

          BASE_URL="https://downloads.immortalwrt.org/releases/${BASE_VER}/targets/ramips/mt7620"
          TARBALL="immortalwrt-toolchain-${BASE_VER}-ramips-mt7620_gcc-${GCC_VER}_musl.Linux-x86_64.tar.zst"

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT

          curl -fsSL --retry 3 "$BASE_URL/sha256sums" | grep " \*${TARBALL}\$" > "$tmp_dir/sha256sums"
          [ -s "$tmp_dir/sha256sums" ] || { echo "ERROR: $TARBALL not found in $BASE_URL/sha256sums" >&2; exit 1; }

          curl -fsSL --retry 3 -o "$tmp_dir/$TARBALL" "$BASE_URL/$TARBALL"
          (cd "$tmp_dir" && sha256sum -c sha256sums)

          tar -xf "$tmp_dir/$TARBALL" -C "$tmp_dir"
          extracted=$(find "$tmp_dir" -maxdepth 2 -type d -name "$TOOLCHAIN_DIR_NAME" | head -n1)
          [ -d "$extracted" ] || { echo "ERROR: expected $TOOLCHAIN_DIR_NAME inside $TARBALL" >&2; exit 1; }

          rm -rf "$TOOLCHAIN_DIR"
          mkdir -p "$(dirname "$TOOLCHAIN_DIR")"
          mv "$extracted" "$TOOLCHAIN_DIR"

          # Undo target/toolchain/Makefile's standalone wrapper.sh rename so
          # staging_dir/toolchain-* matches an in-tree buildroot toolchain layout.
          for f in "$TOOLCHAIN_DIR"/bin/*.bin; do
            [ -e "$f" ] || continue
            mv -f "$f" "${f%.bin}"
          done
          rm -f "$TOOLCHAIN_DIR"/bin/*-wrapper.sh

          ./scripts/patch-specs.sh "$TOOLCHAIN_DIR"
          [ -f "$TOOLCHAIN_DIR/info.mk" ] || { echo "ERROR: $TOOLCHAIN_DIR/info.mk missing" >&2; exit 1; }

          # Verify host-executable cross-compiler runs cleanly on this runner
          "$TOOLCHAIN_DIR/bin/mipsel-openwrt-linux-musl-gcc" --version

          # Satisfy OpenWrt's toolchain/Makefile stamps (must be newer than
          # toolchain/*, tmp/.build, and tools/stamp-compile).
          touch "$TOOLCHAIN_DIR/info.mk"
          mkdir -p "$TOOLCHAIN_DIR/stamp"
          touch "$TOOLCHAIN_DIR/stamp/.gcc_final_installed"
          sleep 1
          touch "$TOOLCHAIN_DIR/stamp/.toolchain_compile"

      - name: Build toolchain from source
        if: inputs.check_only != true && inputs.prebuilt_toolchain == false
        run: make -j"$(nproc)" toolchain/install

      - name: Download sources
        if: inputs.check_only != true
        run: make -j"$(nproc)" download

      # Deliberately no "|| make -j1 V=s world" retry: CONFIG_BUILD_LOG=y
      # already writes per-package logs (uploaded on failure below), and a
      # serial rerun would spend up to an hour reproducing the same failure.
      - name: Build
        if: inputs.check_only != true
        run: make -j"$(nproc)" world

      # Verify the generated ImageBuilder resolves local kernel/kmods + remote
      # mipsel_24kc feeds and produces a complete firmware image + manifest.
      - name: Smoke-test ImageBuilder
        if: inputs.check_only != true
        run: |
          set -euo pipefail
          ib=$(ls bin/targets/ramips/mt7620_nand/immortalwrt-imagebuilder-*.tar.*)
          tmp_ib=$(mktemp -d)
          trap 'rm -rf "$tmp_ib"' EXIT
          tar -xf "$ib" -C "$tmp_ib"
          ib_dir=$(find "$tmp_ib" -mindepth 1 -maxdepth 1 -type d | head -n1)
          make -C "$ib_dir" info | tee "$tmp_ib/info.txt"
          grep -q '^xiaomi_miwifi-r3:' "$tmp_ib/info.txt"
          make -C "$ib_dir" image PROFILE=xiaomi_miwifi-r3 PACKAGES="luci"
          manifest=$(ls "$ib_dir"/bin/targets/ramips/mt7620_nand/*miwifi-r3*.manifest)
          grep -q '^kmod-rt2800-soc ' "$manifest"
          grep -q '^kmod-mt76x2 ' "$manifest"
          grep -q '^luci ' "$manifest"

      # CONFIG_BUILD_LOG=y writes per-package logs; without this a quiet
      # "-C toolchain/binutils ... failed to build" is undiagnosable.
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      # Release outputs are the standalone ImageBuilder + buildinfo files +
      # sha256sums. Kernel package version (vermagic) goes to the job summary
      # for quick comparison across runs.
      - name: Collect release assets
        if: inputs.check_only != true
        run: |
          set -euo pipefail
          rm -rf out && mkdir -p out
          cp bin/targets/ramips/mt7620_nand/immortalwrt-imagebuilder-*.tar.* out/
          cp bin/targets/ramips/mt7620_nand/config.buildinfo out/
          cp bin/targets/ramips/mt7620_nand/feeds.buildinfo out/
          cp bin/targets/ramips/mt7620_nand/version.buildinfo out/
          (cd out && sha256sum * > sha256sums)
          ls -la out/
          kernel=$(head -n1 staging_dir/target-*/kernel.version)
          [ -n "$kernel" ] || { echo "ERROR: kernel.version missing" >&2; exit 1; }
          echo "KERNEL_VERSION=$kernel" >> "$GITHUB_ENV"
          {
            echo "### Build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| upstream base | \`$BASE_REF\` (\`$BASE_SHA\`) |"
            echo "| port commit | \`$GITHUB_SHA\` |"
            echo "| kernel package | \`$kernel\` |"
            echo "| prebuilt toolchain | \`${{ inputs.prebuilt_toolchain != false }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Test builds (workflow_dispatch) get artifacts instead of a release.
      - name: Upload artifacts (test build)
        if: github.ref_type != 'tag' && inputs.check_only != true
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-ramips-mt7620_nand-imagebuilder
          path: out/

      # gh is preinstalled on GitHub-hosted runners (not an extra
      # dependency) and is the least-fragile way to create a release with
      # assets; the raw REST equivalent is two endpoints plus MIME handling.
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xwrt=$(sed -n 's/.*at HEAD \*\*\([0-9a-f]\{40\}\)\*\*.*/\1/p' mt7620-nand/docs/PROVENANCE.md | head -n1)
          # A "Prerelease: <reason>" trailer in the tag annotation (written by
          # tag-release.sh -p) makes this a GitHub pre-release with a warning
          # on top of the notes.
          pre=$(git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents)' \
            | sed -n 's/^Prerelease: //p' | head -n1)
          {
            if [ -n "$pre" ]; then
              echo "> [!WARNING]"
              echo "> **Pre-release — not verified on hardware.** $pre"
              echo "> Prefer the newest non-pre-release build unless you can recover the device yourself (see mt7620-nand/docs/RECOVERY.md)."
              echo
            fi
            echo "ImmortalWrt \`$BASE_REF\` (upstream commit \`$BASE_SHA\`) ImageBuilder for the \`ramips/mt7620_nand\` subtarget,"
            echo "built from port commit \`$GITHUB_SHA\` (x-wrt provenance \`${xwrt:-unknown}\`, see mt7620-nand/docs/PROVENANCE.md)."
            echo
            echo "Kernel package version: \`$KERNEL_VERSION\`"
            echo
            echo "**Assets**: standalone ImageBuilder (\`immortalwrt-imagebuilder-*.tar.zst\`), build metadata (\`*.buildinfo\`), and \`sha256sums\`."
            echo
            echo "### Generating firmware images"
            echo
            echo "Unpack the ImageBuilder on x86_64 Linux (or WSL/Docker) and build images for your device (e.g. Mi Router 3 with LuCI):"
            echo
            echo '```bash'
            echo 'tar xf immortalwrt-imagebuilder-*.tar.zst && cd immortalwrt-imagebuilder-*/'
            echo 'make image PROFILE=xiaomi_miwifi-r3 PACKAGES="luci"'
            echo '```'
            echo
            echo "**Kernel modules are tied to this exact build** (vermagic): install"
            echo "kmods only from *this release's* ImageBuilder, never from another"
            echo "release or the official feeds. See mt7620-nand/docs/GUIDE.md for ImageBuilder usage."
          } > notes.md

          # If a previous publish attempt half-succeeded, this fails on the
          # already-existing release: inspect it, delete it if incomplete,
          # then re-run this workflow run (the tag itself stays valid).
          gh release create "$RELEASE_TAG" \
            --verify-tag ${pre:+--prerelease} \
            --title "ImmortalWrt $BASE_REF for ramips/mt7620_nand ($RELEASE_TAG)" \
            --notes-file notes.md \
            out/*
          echo "Published release $RELEASE_TAG${pre:+ (pre-release)}"
